name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_release.py --version "$(cat VERSION)" --output-dir dist
      - run: cd dist && sha256sum --check SHA256SUMS
